# Local development services. Credentials here are for local dev only.
services:
  postgres:
    image: postgres:16-alpine
    container_name: schoolerp-postgres
    environment:
      # Owner / migration role (superuser inside the container).
      POSTGRES_USER: schoolerp
      POSTGRES_PASSWORD: schoolerp
      POSTGRES_DB: schoolerp
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the non-superuser application role that RLS applies to.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U schoolerp -d schoolerp']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: schoolerp-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
